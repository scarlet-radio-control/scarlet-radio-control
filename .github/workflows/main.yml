jobs:
  build:
    runs-on: "ubuntu-26.04"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-dotnet@v6"
        with:
          global-json-file: "global.json"
      - uses: "actions/setup-node@v7"
        with:
          node-version: "25"
      - run: "dotnet restore"
      - run: "dotnet build"
      - run: "dotnet test"
        if: false
      - run: "dotnet publish"
      - uses: "actions/upload-artifact@v7"
        with:
          if-no-files-found: "error"
          path: "./artifacts/publish/ScarletRadioControl.Web/release/" 
  deploy:
    if: "github.ref == 'refs/heads/tfm'"
    needs: "build"
    runs-on: "ubuntu-26.04"
    steps:
      - uses: "actions/download-artifact@v8"     
        with:
          path: "artifact"
      - uses: "azure/webapps-deploy@v3"    
        with:
          app-name: "scarlet-radio-control-web"
          package: "artifact"
          publish-profile: "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}"
name: "main"
on:
  pull_request:
    branches: [ "main", "release", "tfm" ]
  push:
    branches: [ "main", "release", "tfm" ]
permissions:
  contents: "read"
  packages: "read"
